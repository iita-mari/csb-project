{% extends "layout.html" %}

{% block title %}Search games{% endblock %}

{% block content %}
<h2>Search games</h2>

<form action="/find_item" method="get">
  <p>
    You can search for games by name
  </p>
  <p>
    <label for="query">Search term</label>:
    <input type="text" name="query" id="query" value="{{ query }}">
  </p>
  <input type="submit" value="Search">
</form>

<p>
  <a href="/">Back</a>
</p>

{% if query %}
<h2>Results</h2>

<ul>
  {% for item in results %}
  <li><a href="/item/{{ item.id }}">{{ item.title }}</a></li>
  {% endfor %}
</ul>
{% endif %}
{% endblock %}
