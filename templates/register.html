{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<h2>Register</h2>

<form action="/register" method="post">
  <p>
    <label for="username">Username</label> (1-16 characters): <br />
    <input type="text" name="username" id="username" value="{{ filled.username }}" minlength="1" maxlength="16" required />
  </p>
  <p>
    <label for="password1">Password</label> (at least 1 character): <br />
    <input type="password" name="password1" id="password1" minlength="1" required />
    <!--
    FIXING FLAW 5: IDENTIFICATION AND AUTHENTICATION FAILURES
    <label for="password1">Password</label> (at least 12 characters): <br />
    <input type="password" name="password1" id="password1" minlength="12" required />
    -->
  </p>
  <p>
    <label for="password2">Repeat password</label>: <br />
    <input type="password" name="password2" id="password2" required />
  </p>
  <input type="submit" value="Create account" />
</form>
{% endblock %}
