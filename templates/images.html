{% extends "layout.html" %}

{% block title %}Profile picture{% endblock %}

{% block content %}
<h2>Profile picture</h2>

<p>
    Upload a PNG file up to 100 KB.
</p>
<p>
    The new picture will replace the old profile picture.
</p>

<form action="/images" method="post" enctype="multipart/form-data">
    <p>
        <label for="image">Picture:</label>
        <input type="file" id="image" name="image" accept=".png" />
    </p>
    <!--
    FIXING FLAW 1: CSRF
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    -->
    <input type="submit" value="Upload" />
</form>
<p>
    <a href="/user/{{ session.user_id }}">Back to profile</a> | <a href="/">Back to front page</a>
</p>
{% endblock %}
